[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-of-evolution"
version = "1.0.0"
description = "Conway's Game of Life with levelled cells, on a hand-written CUDA kernel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Javier Cabero" }]
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x[ctk]"]
dev = ["pytest>=7"]

[project.scripts]
goe = "goe.cli:main"

[tool.setuptools.packages.find]
include = ["goe*"]
